<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons: every file below is generated from assets/icon-master.png by
         scripts/generate-icon-assets.py — see README.md -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="application-name" content="Cambuz" />
    <meta name="apple-mobile-web-app-title" content="Cambuz" />

    <meta name="author" content="Rajesh Singh, PixlDot" />
    <title>Cambuz PDF Reader — A free PDF reader without the bloat</title>
    <meta
      name="description"
      content="Cambuz is a free desktop PDF reader for Windows. Open, read, search, and print PDFs without subscriptions, bloat, or unnecessary complexity."
    />

    <!-- Open Graph / Twitter: absolute URLs so scrapers resolve them.
         Per-page tags are refreshed at runtime by src/hooks/useSeo.ts -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cambuz PDF Reader" />
    <meta property="og:url" content="https://cambuz.pixldot.com/" />
    <meta property="og:title" content="Cambuz PDF Reader — A free PDF reader without the bloat" />
    <meta
      property="og:description"
      content="Cambuz is a free desktop PDF reader for Windows. Open, read, search, and print PDFs without subscriptions, bloat, or unnecessary complexity."
    />
    <meta property="og:image" content="https://cambuz.pixldot.com/social/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cambuz PDF Reader app icon beside the words “Cambuz PDF Reader — Your PDFs. Nothing in the way.”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cambuz PDF Reader — A free PDF reader without the bloat" />
    <meta
      name="twitter:description"
      content="Cambuz is a free desktop PDF reader for Windows. Open, read, search, and print PDFs without subscriptions, bloat, or unnecessary complexity."
    />
    <meta name="twitter:image" content="https://cambuz.pixldot.com/social/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Cambuz PDF Reader app icon beside the words “Cambuz PDF Reader — Your PDFs. Nothing in the way.”"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
